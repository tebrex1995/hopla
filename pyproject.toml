[project]
name = "hopla"
version = "0.1.0"
description = "Serbian train + bus planner with change alerts"
requires-python = ">=3.14"
dependencies = [
    "httpx>=0.27",
    "fastapi>=0.115",
    "pydantic>=2.8",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hopla"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
extend-exclude = [".claude", ".claude-flow", ".agents", ".agentic-qe", ".swarm"]
