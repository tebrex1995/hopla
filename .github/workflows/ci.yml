name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Job ids are the required status checks (04 §7): lint, types, test.
# Renaming one silently blocks every PR until branch protection is updated.
jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # gitleaks scans the pushed or PR commit range
          persist-credentials: false
      - name: gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        # Public repo: listing PR commits needs no extra token scope. If the repo ever goes
        # private, add `pull-requests: read` to this job.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: false
          GITLEAKS_VERSION: 8.30.1 # same rules as local; the action's default is older
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
          cache-python: true
      - run: uv sync --locked
      - run: uv run --no-sync ruff check .
      - run: uv run --no-sync ruff format --check .

  types:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
          cache-python: true
      - run: uv sync --locked
      - run: uv run --no-sync mypy

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
          cache-python: true
      - run: uv sync --locked
      - run: uv run --no-sync pytest -m "unit or contract"

  # The install users get: no dev tools. Catches a dev-only import in src/ and a
  # broken console-script target. Not a required check until T-R0-06.
  smoke:
    name: install-set smoke
    needs: [lint, types, test]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
          cache-python: true
      # A real (non-editable) install, as users get it: catches files missing from the wheel.
      # --reinstall-package: never reuse a cached wheel of hopla (a stale one would pass falsely).
      - run: uv sync --locked --no-dev --no-editable --reinstall-package hopla
      # Call the venv directly: a bare `uv run` would re-sync the dev group and hide the bug.
      - run: .venv/bin/hopla --help
      - run: .venv/bin/hopla --version
      - name: import every module without dev tools
        run: >-
          .venv/bin/python -c "import importlib, pkgutil, hopla;
          [importlib.import_module(m.name) for m in pkgutil.walk_packages(hopla.__path__, 'hopla.')]"
