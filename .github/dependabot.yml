# Keeps the SHA-pinned actions and uv.lock current. The cooldown skips releases younger than
# a week, so a compromised new version has time to be caught before it is proposed here.
# Not covered, bump by hand: PINNED_UV_* and the gitleaks version and checksum in ci.yml,
# and build-constraint-dependencies in pyproject.toml.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
